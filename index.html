<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Do I Have It</title>
<style>
  :root {
    --paper: #F1F3F1;
    --ink: #16201C;
    --ink-soft: #5A6862;
    --moss: #2F5D50;
    --rule: #D3DAD6;
    --alarm: #8C2F22;
    --bubble-user: #DDE5E1;
    --bubble-bot: #FBFCFB;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    line-height: 1.55;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 1.5rem 1.25rem 0.75rem;
    max-width: 34rem;
    width: 100%;
    margin: 0 auto;
  }

  h1 {
    font-size: 2rem;
    font-weight: 400;
    line-height: 1.05;
    margin: 0;
    letter-spacing: -0.015em;
  }

  .sub {
    margin: 0.25rem 0 0;
    color: var(--ink-soft);
    font-size: 0.95rem;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem 1.25rem 1rem;
    max-width: 34rem;
    width: 100%;
    margin: 0 auto;
  }

  .msg {
    max-width: 85%;
    padding: 0.65rem 0.9rem;
    border-radius: 12px;
    margin: 0.5rem 0;
    white-space: pre-wrap;
  }

  .msg.user {
    background: var(--bubble-user);
    margin-left: auto;
    border-bottom-right-radius: 3px;
  }

  .msg.bot {
    background: var(--bubble-bot);
    border: 1px solid var(--rule);
    border-bottom-left-radius: 3px;
  }

  .msg.error {
    color: var(--alarm);
    background: transparent;
    border: 1px solid var(--alarm);
  }

  .msg.thinking {
    color: var(--ink-soft);
    font-style: italic;
  }

  footer {
    border-top: 1px solid var(--rule);
    padding: 0.75rem 1.25rem 1.25rem;
    background: var(--paper);
  }

  .bar {
    display: flex;
    gap: 0.5rem;
    max-width: 34rem;
    margin: 0 auto;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    min-height: 2.75rem;
    max-height: 8rem;
    padding: 0.6rem 0.8rem;
    font: inherit;
    color: var(--ink);
    background: #FBFCFB;
    border: 1px solid var(--rule);
    border-radius: 3px;
    resize: none;
  }

  textarea:focus {
    outline: 2px solid var(--moss);
    outline-offset: 1px;
    border-color: transparent;
  }

  button {
    font: inherit;
    padding: 0.6rem 1.1rem;
    color: #FBFCFB;
    background: var(--moss);
    border: none;
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
  }

  button.secondary {
    background: transparent;
    color: var(--moss);
    border: 1px solid var(--moss);
  }

  button.listening {
    background: var(--alarm);
    color: #FBFCFB;
    border-color: var(--alarm);
  }

  button:hover { background: #26493F; }
  button.secondary:hover { background: rgba(47, 93, 80, 0.08); }
  button.listening:hover { background: #6E2419; }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .hint {
    max-width: 34rem;
    margin: 0.5rem auto 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
    gap: 1rem;
  }

  .hint label { cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Do I have it?</h1>
  <p class="sub">Tell it what you bought. Ask before you buy again.</p>
</header>

<div id="log"></div>

<footer>
  <div class="bar">
    <button id="mic" type="button" class="secondary">Speak</button>
    <textarea id="entry" rows="1" placeholder="I need a screwdriver…"></textarea>
    <button id="send" type="button">Send</button>
  </div>
  <div class="hint">
    <span id="status"></span>
    <label><input type="checkbox" id="speakBack" checked> Read replies aloud</label>
  </div>
</footer>

<script>
  const CHAT_URL = "https://iqbuwsawy7.execute-api.us-east-2.amazonaws.com/chat";

  const log = document.getElementById("log");
  const entry = document.getElementById("entry");
  const sendBtn = document.getElementById("send");
  const mic = document.getElementById("mic");
  const status = document.getElementById("status");
  const speakBack = document.getElementById("speakBack");

  // Conversation history sent to the server on every turn.
  // Only plain user/assistant text is kept; tool calls are resolved server-side.
  const history = [];

  function addBubble(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  /* function say(text) {
    if (!speakBack.checked || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    window.speechSynthesis.speak(u);
  } */

  const PREFERRED_VOICES = [
    "Google US English",
    "Samantha",
    "Ava",
    "Allison",
    "Microsoft Aria Online (Natural) - English (United States)"
  ];

  function pickVoice() {
    const voices = window.speechSynthesis.getVoices();
    for (const name of PREFERRED_VOICES) {
      const v = voices.find(v => v.name === name);
      if (v) return v;
    }
    return voices.find(v => v.lang === "en-US") || null;
  }

  function say(text) {
    if (!speakBack.checked || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 1.05;
    const v = pickVoice();
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  }

  // Chrome loads voices asynchronously; this warms the list.
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  async function send(textOverride) {
    const text = (textOverride ?? entry.value).trim();
    if (!text) return;

    entry.value = "";
    addBubble(text, "user");
    history.push({ role: "user", content: text });

    sendBtn.disabled = true;
    mic.disabled = true;
    const thinking = addBubble("…", "bot thinking");

    try {
      const res = await fetch(CHAT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });
      if (!res.ok) throw new Error("Server returned " + res.status);

      const data = await res.json();
      const reply = data.reply || "(no reply)";

      thinking.remove();
      addBubble(reply, "bot");
      history.push({ role: "assistant", content: reply });
      say(reply);
    } catch (err) {
      thinking.remove();
      history.pop();
      addBubble("Something went wrong: " + err.message, "msg error");
    } finally {
      sendBtn.disabled = false;
      mic.disabled = false;
      entry.focus();
    }
  }

  sendBtn.addEventListener("click", () => send());

  entry.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  // Voice: press Speak, talk, it sends automatically when you pause.
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SR) {
    mic.disabled = true;
    mic.textContent = "No mic";
  } else {
    const recog = new SR();
    recog.lang = "en-US";
    recog.interimResults = false;
    recog.continuous = false;
    let listening = false;

    mic.addEventListener("click", () => {
      if (listening) { recog.stop(); return; }
      window.speechSynthesis && window.speechSynthesis.cancel();
      recog.start();
    });

    recog.addEventListener("start", () => {
      listening = true;
      mic.textContent = "Stop";
      mic.classList.add("listening");
      status.textContent = "Listening…";
    });

    recog.addEventListener("result", (e) => {
      const said = e.results[0][0].transcript;
      status.textContent = "";
      send(said);
    });

    recog.addEventListener("error", (e) => {
      status.textContent = "Mic error: " + e.error;
    });

    recog.addEventListener("end", () => {
      listening = false;
      mic.textContent = "Speak";
      mic.classList.remove("listening");
      if (status.textContent === "Listening…") status.textContent = "";
    });
  }

  addBubble("What did you buy, or what are you thinking of buying?", "bot");
</script>
</body>
</html>
